name: Profile validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate banner and local README links
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          ET.parse('assets/banner.svg')
          text = pathlib.Path('README.md').read_text()
          assert '@gmail.com' not in text.lower(), 'Private email in README'
          for target in re.findall(r'\]\(([^)]+)\)', text):
              if not target.startswith(('https://', 'mailto:', '#')):
                  assert pathlib.Path(target).is_file(), target
          PY
